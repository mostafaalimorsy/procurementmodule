# Shared by every product host: static artifact, security headers and the same-origin API proxy.
root /usr/share/nginx/html;
index index.html;
absolute_redirect off;

# CF-120 (ADR-147): no version in Server headers or error pages; HSTS (the TLS ingress answers on HTTPS — add includeSubDomains there once every
# subdomain serves HTTPS); browser features the product never uses are switched off.
server_tokens off;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cache-Control "no-store" always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

location /api/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
}

# Red-team B-06 (CF-096): the workers check names the background workers and the scanner state, so it is internal — the host probes it on the
# API port (tools/ops/check-health.sh --api-url); the public hosts serve only live and ready. A regex location wins over the /health prefix.
location ~* ^/health/workers/?$ {
    return 404;
}

location /health {
    proxy_pass http://api:8080;
    # The API's AllowedHosts (CF-120) checks the public host, not the internal service name.
    proxy_set_header Host $host;
}
