# Platform Console host: enters the console directly and sends company routes to the Workspace host.
# Built assets live under /en/ and /ar/ and are served as files. The API remains the security boundary.
location ~ ^/(en|ar)/?$ { return 302 /$1/platform/$is_args$args; }
location ~ ^/(en|ar)/platform(/|$) { try_files $uri /$1/index.html; }
location ~ ^/(en|ar)/ { try_files $uri @workspace; }
location @workspace { return 302 $workspace_origin$request_uri; }

location = / { return 302 /$preferred_locale/platform/; }
location ~ ^/platform(/|$) { return 302 /$preferred_locale$request_uri; }
location / { return 302 $workspace_origin$request_uri; }
