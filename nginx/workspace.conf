# Company Workspace host: every tenant route, with the Platform Console sent to its own host. This is
# presentation separation only; the API still authenticates and authorizes every request.
# CF-066 (ADR-142): the platform API is never served on the company host — operators reach it only through the console host
# (behind the VPN or IP allow-list of the ingress, PILOT_RUNBOOK §1).
# Re-audit R-04: matched without regard to case — the API's routing ignores case, so a prefix match alone let /api/v1/Platform/ through.
location ~* ^/api/v1/platform(/|$) { return 404; }
location ~ ^/(en|ar)/platform(/|$) { return 302 $platform_origin$request_uri; }
location ~ ^/platform(/|$) { return 302 $platform_origin/$preferred_locale$request_uri; }

# Directory import uploads are the only request bodies above nginx's 1 MB default, and only on the
# company host. The API still applies its own tighter per-format and per-route limits.
location ~ ^/api/v1/subcontractors/import/(preview|confirm)$ {
    client_max_body_size 6m;
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
}

# Tender documents, and (Part 8) the documents an addendum brings: one file of at most 25 MB per request. The API
# applies the exact limit and type checks.
location ~ "^/api/v1/tenders/[0-9a-fA-F-]{36}/(addenda/[0-9a-fA-F-]{36}/)?documents$" {
    client_max_body_size 26m;
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
}

# Bid attachments from the bidder portal and from a negotiation round's page (Part 10): one file of at most 25 MB per
# request, under the same per-client limit as the rest of the anonymous bidder API. The API applies the exact size, type
# and per-link upload limits.
location ~ ^/api/v1/tender-invitations/(bid|negotiation)/attachments$ {
    client_max_body_size 26m;
    limit_req zone=tender_invitations burst=10 nodelay;
    limit_req_status 429;
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
}

# The anonymous bidder API: one client cannot use up the API's shared ceiling for every other bidder.
location /api/v1/tender-invitations/ {
    limit_req zone=tender_invitations burst=30 nodelay;
    limit_req_status 429;
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
}

location = /en { return 302 /en/$is_args$args; }
location = /ar { return 302 /ar/$is_args$args; }
location /en/ { try_files $uri $uri/ /en/index.html; }
location /ar/ { try_files $uri $uri/ /ar/index.html; }
location / { return 302 /$preferred_locale$request_uri; }
